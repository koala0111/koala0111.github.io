    * {

    body {
      margin: 0;
      padding: 20px;

    }

    .button {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin: 9px 0;
      border-radius: 12px;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #333;
      transition: opacity 0.2s;
    }

    .button:hover {
      opacity: 0.85;
    }

    .old .button {
      background: #555;
    }

    .new .button {
      background: #2878f0;
    }

    .farm .button {

    }

    .qr {

    }

    .label {
      font-size: 13px;
      color: #777;
      margin-top: -3px;
      margin-bottom: 5px;
    }

</head>
